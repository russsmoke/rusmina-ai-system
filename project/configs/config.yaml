# Общие настройки проекта
random_state: 42
test_size: 0.2

# Пути к данным
data:
  raw_path: "data/raw/Churn_Modelling.csv"

# Признаки
features:
  - CreditScore
  - Age
  - Tenure
  - Balance
  - NumOfProducts
  - IsActiveMember
  - Age_Group
  - Tenure_Ratio
  - Balance_Per_Product
  - Active_Senior
  - Has_Balance
  - Is_Multi_Product
  - Gender_Male

age_bins: [17, 30, 40, 50, 60, 100]
age_labels: [0, 1, 2, 3, 4]

catboost:
  iterations: 700
  depth: 4
  learning_rate: 0.01
  l2_leaf_reg: 1
  border_count: 64 
  class_weights: [1, 3]
  eval_metric: "AUC"
  loss_function: "Logloss"
  early_stopping_rounds: 50
  random_seed: 42
  verbose: 100
  optimal_threshold: 0.53