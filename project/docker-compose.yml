services:
  api:
    build: .
    ports:
      - "8000:8000"
    # env_file:
    #   - .env          # переменные окружения — НЕ в репозитории!
    volumes:
      - ./artifacts:/app/artifacts   # модели снаружи контейнера
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

volumes:
  mlflow_data: